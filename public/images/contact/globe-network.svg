  <circle cx="222" cy="628" r="4" fill="none" stroke="#2E9E5B"><animate attributeName="r" from="4" to="11" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" from="0.9" to="0" dur="1.8s" repeatCount="indefinite"/></circle>
