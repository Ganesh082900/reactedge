<svg xmlns="http://www.w3.org/2000/svg" viewBox="25 40 760 635" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">Get in touch with ReActEdge</title>
  <desc id="d">A glowing data globe with USA, EMEA and APAC pins sends secure messages to a central encrypted-envelope hub.</desc>
  <defs>
