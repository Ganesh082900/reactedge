<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="t d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Operational data into actionable intelligence</title>
  <desc id="d">A live ReActEdge console detects an anomaly and shows it contained, through a sense, detect, respond flow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F28A2E"/>
      <stop offset="0.45" stop-color="#F7A85A"/>
      <stop offset="1" stop-color="#C4561A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5A2200" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bg)"/>
  <rect width="500" height="500" fill="url(#glow)"/>
  <circle cx="250" cy="260" r="215" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-dasharray="4 8"/>
  <circle cx="250" cy="260" r="160" fill="none" stroke="#FFFFFF" stroke-opacity="0.22"/>

  <!-- Console -->
  <g filter="url(#shadow)">
    <rect x="90" y="150" width="320" height="220" rx="16" fill="#2686C6"/>
  </g>
  <path d="M90 166 a16 16 0 0 1 16 -16 H394 a16 16 0 0 1 16 16 V184 H90 Z" fill="#1F6FA8"/>
  <circle cx="108" cy="167" r="4" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="122" cy="167" r="4" fill="#FFFFFF" opacity="0.65"/>
  <circle cx="136" cy="167" r="4" fill="#FFFFFF" opacity="0.4"/>
  <text x="152" y="171" font-size="10" font-weight="600" letter-spacing="1.5" fill="#FFFFFF">LIVE OT INTELLIGENCE</text>
  <circle cx="394" cy="167" r="4" fill="#97C459"/>
  <circle cx="394" cy="167" r="4" fill="none" stroke="#97C459">
    <animate attributeName="r" from="4" to="10" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.9" to="0" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Chart -->
  <rect x="106" y="198" width="196" height="118" rx="10" fill="#1A5F92"/>
  <path d="M114 226 H294 M114 258 H294 M114 290 H294" stroke="#FFFFFF" stroke-opacity="0.15" fill="none"/>
  <clipPath id="chart-clip"><rect x="106" y="198" width="196" height="118" rx="10"/></clipPath>
  <g clip-path="url(#chart-clip)">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-180 0" dur="3.6s" repeatCount="indefinite"/>
      <g id="wave" transform="translate(-8 0)">
        <path d="M114 258 L140 258 L152 246 L164 268 L178 252 L190 258 L214 258 L226 212 L238 296 L252 254 L264 258 L294 258" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <circle cx="226" cy="212" r="5" fill="#F28A2E"/>
        <circle cx="226" cy="212" r="5" fill="none" stroke="#F28A2E" stroke-width="2">
          <animate attributeName="r" from="5" to="14" dur="1.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" from="1" to="0" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <text x="212" y="210" text-anchor="end" font-size="9.5" font-weight="600" fill="#FFD9A8">Anomaly caught</text>
      </g>
      <use href="#wave" x="180"/>
      <use href="#wave" x="360"/>
    </g>
  </g>
  <!-- Shield + status -->
  <g transform="translate(354 228)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1 1;-1 1;1 1" dur="2.4s" repeatCount="indefinite"/>
      <g transform="translate(-354 -228)">
        <path d="M354 204 L374 212 V230 Q374 244 354 252 Q334 244 334 230 V212 Z" fill="#FFFFFF"/>
        <path d="M345 228 L352 235 L364 220" fill="none" stroke="#2686C6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
  <rect x="314" y="262" width="80" height="20" rx="10" fill="#FFFFFF"/>
  <text x="354" y="276" text-anchor="middle" font-size="10" font-weight="700" fill="#0B2B26">Contained</text>
  <rect x="314" y="288" width="80" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.18"/>
  <text x="354" y="302" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">Zero downtime</text>

  <!-- Sense / Detect / Respond -->
  <rect x="106" y="330" width="84" height="26" rx="13" fill="#1A5F92"/>
  <text x="148" y="347" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Sense</text>
  <rect x="208" y="330" width="84" height="26" rx="13" fill="#1A5F92"/>
  <text x="250" y="347" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Detect</text>
  <rect x="310" y="330" width="84" height="26" rx="13" fill="#F28A2E"/>
  <text x="352" y="347" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Respond</text>
  <path d="M195 343 L203 343 M200 339 L204 343 L200 347 M297 343 L305 343 M302 339 L306 343 L302 347" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Caption -->
  <text x="250" y="397" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">Operational data → actionable intelligence</text>
</svg>
