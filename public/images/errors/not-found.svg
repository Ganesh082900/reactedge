<svg width="100%" viewBox="0 0 680 410" role="img" style="" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">404 page not found for a cybersecurity website</title><desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">The numerals 4, 0, 4 appear in extruded purple, with the zero drawn as a radar that has lost its target. An isometric platform shows a teal home building connected by a conduit that is severed with an amber spark, leading to a dashed ghost building labeled Requested page with a question mark. A shield on a plinth keeps guarding.</desc><style>
g,path,circle,polygon,ellipse,use{transform-box:fill-box}
.n4a{animation:fromleft 1s cubic-bezier(.22,1,.36,1) .1s both}
.n4b{animation:fromright 1s cubic-bezier(.22,1,.36,1) .1s both}
.radar{transform-origin:center;animation:pop 1s cubic-bezier(.34,1.4,.64,1) .4s both}
.sweep{transform-box:view-box;transform-origin:340px 110px;animation:spin 3s linear 1.2s infinite}
.blip{animation:blink 1.4s ease-in-out 1.4s infinite}
.base{animation:rise 1s cubic-bezier(.22,1,.36,1) .8s both}
.home{animation:rise .9s cubic-bezier(.22,1,.36,1) 1.3s both}
.conduit{animation:fade .8s ease 1.6s both}
.spark{transform-origin:center;animation:fade .4s ease 1.8s both,flash 1.1s ease-in-out 2.2s infinite}
.ghost{animation:fade .8s ease 1.9s both,flicker 3s ease-in-out 2.7s infinite}
.shield{animation:rise .9s cubic-bezier(.34,1.4,.64,1) 2.1s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fromleft{from{opacity:0;transform:translateX(-80px)}to{opacity:1;transform:none}}
@keyframes fromright{from{opacity:0;transform:translateX(80px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.2) rotate(-120deg)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:.2}}
@keyframes flash{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(1.5)}}
@keyframes flicker{0%,100%{opacity:1}45%{opacity:.35}55%{opacity:.8}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
