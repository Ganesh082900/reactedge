  <path d="M532 108 L546 108 L534 120 Z" fill="#166FB4"/>
  <text x="536" y="74" font-size="12" font-weight="600" fill="#FFFFFF">Our plant network needs</text>
  <text x="536" y="92" font-size="12" font-weight="600" fill="#FFFFFF">protection from new threats.</text>
  <rect x="500" y="126" width="270" height="58" rx="14" fill="#F07F22" stroke="#F07F22"/>
  <path d="M754 184 L768 184 L768 196 Z" fill="#F07F22"/>
  <text x="516" y="150" font-size="12" font-weight="600" fill="#FFFFFF">Let's map your environment and</text>
